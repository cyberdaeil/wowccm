[package]
name = "wowccm-player"
version = "2.0.0"
description = "WOWCCM 와플 - 24시간 찬양방송 플레이어"
authors = ["WOWCCM"]
edition = "2021"

[lib]
name = "wowccm_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "cookies"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["time"] }

# Windows 볼륨 팝업(시스템 미디어 컨트롤)에 곡 정보를 띄우고 미디어 키를 받는다
[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.8", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
