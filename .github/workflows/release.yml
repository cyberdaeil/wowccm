name: 설치 파일 빌드

# v2.0.0 같은 태그를 푸시하거나, Actions 탭에서 직접 실행(태그 이름 입력)하면
# Windows(.exe)와 Mac(.dmg) 설치 파일을 만들어 GitHub Releases에 올린다.
# 태그에 "-"가 들어가면(예: v2.0.0-test1) 시험판(pre-release)으로 표시한다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "만들 버전 태그 (예: v2.0.0-test1). 없으면 새로 만든다"
        required: true
        default: "v2.0.0-test1"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # 태그 번호를 앱 버전으로 쓴다. (v2.0.1 → 2.0.1)
      # 자동 업데이트는 이 번호를 비교하므로, 새 버전을 낼 때는 태그 번호만 올리면 된다.
      # 시험판 태그(v2.0.1-test1)는 뒤의 -test1을 떼고 숫자 부분만 쓴다.
      - name: 버전 맞추기
        shell: bash
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          VER="${TAG#v}"
          VER="${VER%%-*}"
          echo "앱 버전: $VER"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$VER"

      # Mac 서명·공증: 저장소 Secrets에 APPLE_* 값이 모두 있을 때만 켠다.
      # (빈 값을 그대로 넘기면 빌드 도구가 빈 인증서로 서명하려다 실패하므로, 있을 때만 환경변수로 내보낸다)
      - name: Mac 서명 준비
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Mac 앱에 서명합니다: $APPLE_SIGNING_IDENTITY"
            {
              echo "APPLE_CERTIFICATE=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\n\r ')"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Apple 공증도 진행합니다"
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
            else
              echo "공증 정보(APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID)가 없어 서명만 합니다"
            fi
          else
            echo "Apple 인증서가 등록되지 않아 서명 없이 빌드합니다"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 자동 업데이트 파일 서명용 비밀 키 (저장소 Settings → Secrets and variables → Actions 에 등록)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "WOWCCM Player ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            ## 설치 방법

            **Windows**: `WOWCCM.Player_…_x64-setup.exe`를 받아 실행하세요.
            "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누릅니다. (코드 서명 전이라 나오는 경고입니다)

            **Mac**: `WOWCCM.Player_…_universal.dmg`를 받아 열고, 앱을 **응용 프로그램** 폴더로 끌어 놓으세요.
            처음 열 때 "확인되지 않은 개발자" 또는 "손상되었기 때문에 열 수 없습니다"가 나오면:
            - **시스템 설정 → 개인정보 보호 및 보안** 맨 아래의 **그래도 열기**를 누르거나,
            - **터미널**에서 `xattr -cr "/Applications/WOWCCM Player.app"` 을 한 번 실행한 뒤 다시 여세요.
            (Apple 개발자 서명 전이라 나오는 경고입니다)
          releaseDraft: false
          prerelease: ${{ contains(github.ref_type == 'tag' && github.ref_name || inputs.tag, '-') }}
          args: ${{ matrix.args }}

      # Releases 업로드가 실패해도 Actions 화면에서 받을 수 있도록 따로 보관
      - uses: actions/upload-artifact@v4
        with:
          name: wowccm-player-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn
